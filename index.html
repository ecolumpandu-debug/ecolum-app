<style>
:root{--bg:#f3f5f1;--green:#1b2e22;--ink:#17231d;--muted:#5d6b63;--ring:#3f8f5f;--btn:#1b2e22;--btn-ink:#fff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--ink:#e8efe9;--muted:#93a39a;--btn:#2f6b47}}

html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.logo{display:inline-block;margin-bottom:40px}
.logo img{display:block;height:64px;width:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;padding:12px 18px;border-radius:6px}}
:root[data-theme="dark"] .logo{background:#fff;padding:12px 18px;border-radius:6px}
h1{font:700 clamp(36px,7vw,64px)/1.05 "Barlow Condensed",sans-serif;margin:0 0 16px;max-width:16ch}
p{margin:0 0 32px;color:var(--muted);max-width:44ch}
.btn{display:inline-block;padding:14px 40px;border-radius:4px;background:var(--btn);color:var(--btn-ink);font:700 19px "Barlow Condensed",sans-serif;letter-spacing:.05em;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
footer{background:var(--green);color:#b8c9be;text-align:center;font-size:14px;padding:16px;
  background-image:repeating-linear-gradient(90deg,transparent 0 63px,rgba(255,255,255,.07) 63px 64px)}
</style>
